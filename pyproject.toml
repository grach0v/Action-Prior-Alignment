[project]
name = "a2"
version = "0.2.0"
description = "Action Prior Alignment - Language-conditioned Pick and Place in Clutter"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Kechun Xu", email = "kcxu@zju.edu.cn" }]
maintainers = [{ name = "Denis Grachev", email = "grach0v@github.com" }]
keywords = ["robotics", "grasping", "pick-and-place", "language-conditioned", "action-prior"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML - aligned with LeRobot compatibility
    "torch>=2.2.1",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "transformers>=4.45.0",
    "huggingface-hub>=0.25.0",
    "safetensors>=0.4.3",
    "einops>=0.8.0",
    "timm>=1.0.11",

    # Numerical / Scientific
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "scikit-image>=0.22.0",
    "pandas>=2.2.0",
    "h5py>=3.10.0",

    # Vision
    "opencv-python>=4.9.0",
    "Pillow>=10.2.0",
    "imageio>=2.34.0",
    "open3d>=0.18.0",
    "open3d-plus>=0.1.0",
    "pycocotools>=2.0.7",

    # 3D / Robotics
    "pybullet>=3.2.6",
    "trimesh>=4.3.0",
    "PyMCubes>=0.1.4",
    "transforms3d>=0.4.1",
    "pyquaternion>=0.9.9",

    # GraspNet related
    "grasp-nms>=1.0.2",
    "graspnetAPI>=1.2.11",
    "gdown>=5.1.0",

    # Visualization
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "dash>=2.16.0",

    # Config / Utils
    "addict>=2.4.0",
    "ConfigArgParse>=1.7",
    "PyYAML>=6.0.1",
    "ruamel.yaml>=0.18.5",
    "yacs>=0.1.8",

    # Misc
    "tqdm>=4.66.0",
    "colorlog>=6.8.0",
    "termcolor>=2.4.0",
    "tabulate>=0.9.0",
    "beautifulsoup4>=4.12.0",
    "ftfy>=6.2.0",
    "networkx>=3.2",
    "protobuf>=4.25.0",
    "tensorboardX>=2.6.0",
    "fvcore>=0.1.5.post20221221",
    "iopath>=0.1.10",
    "portalocker>=2.8.0",
    "typeguard>=4.2.0",
    "sympy>=1.13.0",
    "setproctitle>=1.3.0",
    "Cython>=3.0.0",
    "tokenizers>=0.19.0",

    # Optional / Legacy
    "cvxopt>=1.3.2",
    "ffmpeg-python>=0.2.0",
    "ansi2html>=1.9.0",
    "ipython>=8.20.0",
    "ipywidgets>=8.1.0",
    "pyglet>=2.0.0",
    "pyserial>=3.5",
    "PyWavefront>=1.3.3",
    "supervision>=0.20.0",
    "yapf>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
# For future LeRobot integration
lerobot = [
    "lerobot>=0.1.0",
    "accelerate>=1.0.0",
    "diffusers>=0.27.0",
    "datasets>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a2*", "action_generator*", "data_collection*", "env*", "feature_extractor*", "helpers*", "models*", "utils*"]
exclude = ["models.graspnet_new*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.txt"]

[tool.uv]
# Override deprecated/pinned dependencies from graspnetAPI
# graspnetAPI has overly strict pins that conflict with modern packages
override-dependencies = [
    "sklearn ; python_version < '0'",  # deprecated, scikit-learn provides it
    "numpy>=1.26.0,<3.0.0",
    "transforms3d>=0.4.0",
    "pillow>=10.0.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "opencv-python>=4.9.0",
    "tqdm>=4.66.0",
    "autolab-core>=1.1.0",
    "trimesh>=4.0.0",
]

# CUDA 12.4 wheels for Linux (default)
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
# On Linux with CUDA, use CUDA wheels
# On macOS, uv will automatically fall back to default PyPI (which has MPS support)
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
